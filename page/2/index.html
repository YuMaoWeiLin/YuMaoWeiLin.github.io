20T03:30:00.000Z">2026-03-20</time></div><h1 class="recent-title">数论与算法应用之欧几里得算法</h1><div class="recent-excerpt"><hr><p>欧几里得算法，也叫<strong>辗转相除法</strong>，是求两个整数最大公约数的经典方法。<br>它不仅写法简洁，而且效率非常高，是数论中最基础的工具之一</p>
<p>它的核心思想可以概括为一句话：</p>
<p><strong>两个数的最大公约数，等于较小的数和余数的最大公约数。</strong></p></div><span class="read-more">READ MORE +</span></object></a><a class="recent-post" href="/2026/03/20/C-%E5%9F%BA%E7%A1%80%E7%AE%97%E6%B3%95%E4%B9%8B%E4%BA%8C%E5%88%86%E6%9F%A5%E6%89%BE/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%AE%97%E6%B3%95%E5%AD%A6%E4%B9%A0/">算法学习</a></object></span><span class="tags"><object><a href="/tags/C/">C++</a></object><object><a href="/tags/%E7%AE%97%E6%B3%95/">算法</a></object><object><a href="/tags/%E4%BA%8C%E5%88%86%E6%9F%A5%E6%89%BE/">二分查找</a></object><object><a href="/tags/%E4%BA%8C%E5%88%86%E7%AD%94%E6%A1%88/">二分答案</a></object><object><a href="/tags/%E6%9C%89%E5%BA%8F%E6%95%B0%E7%BB%84/">有序数组</a></object></span><time datetime="2026-03-20T03:15:00.000Z">2026-03-20</time></div><h1 class="recent-title">C++基础算法之二分查找</h1><div class="recent-excerpt"><hr><p>二分查找是一种非常高效的查找方法<br>当数据已经有序时，它可以大幅减少查找次数</p>
<p>二分查找的核心思想可以概括为一句话：</p>
<p><strong>每次把查找区间缩小一半</strong></p></div><span class="read-more">READ MORE +</span></object></a><a class="recent-post" href="/2026/03/20/C-%E5%9F%BA%E7%A1%80%E7%AE%97%E6%B3%95%E4%B9%8B%E5%B9%BF%E5%BA%A6%E4%BC%98%E5%85%88%E6%90%9C%E7%B4%A2/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%AE%97%E6%B3%95%E5%AD%A6%E4%B9%A0/">算法学习</a></object></span><span class="tags"><object><a href="/tags/C/">C++</a></object><object><a href="/tags/%E7%AE%97%E6%B3%95/">算法</a></object><object><a href="/tags/%E5%B9%BF%E5%BA%A6%E4%BC%98%E5%85%88%E6%90%9C%E7%B4%A2/">广度优先搜索</a></object><object><a href="/tags/%E9%98%9F%E5%88%97/">队列</a></object><object><a href="/tags/%E6%9C%80%E7%9F%AD%E8%B7%AF/">最短路</a></object><object><a href="/tags/%E8%BF%B7%E5%AE%AB/">迷宫</a></object></span><time datetime="2026-03-20T03:00:00.000Z">2026-03-20</time></div><h1 class="recent-title">C++基础算法之广度优先搜索</h1><div class="recent-excerpt"><hr><p>广度优先搜索，英文叫 <strong>Breadth First Search</strong>，通常简称 <strong>BFS</strong>。<br>它是一种非常经典的搜索算法，常用于图的遍历、迷宫最短路、状态转移等问题<br>BFS 的核心思想可以概括为一句话：</p>
<p><strong>从起点开始，一层一层向外扩展。</strong></p></div><span class="read-more">READ MORE +</span></object></a><a class="recent-post" href="/2026/03/20/%E6%95%B0%E8%AE%BA%E4%B8%8E%E7%AE%97%E6%B3%95%E5%BA%94%E7%94%A8%E4%B9%8B%E8%B4%A8%E6%95%B0%E6%80%A7%E8%B4%A8%E4%B8%8E%E5%9F%BA%E7%A1%80%E8%B4%A8%E6%95%B0%E7%AD%9B/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%AE%97%E6%B3%95%E5%AD%A6%E4%B9%A0/">算法学习</a></object></span><span class="tags"><object><a href="/tags/C/">C++</a></object><object><a href="/tags/%E7%AE%97%E6%B3%95/">算法</a></object><object><a href="/tags/%E6%95%B0%E8%AE%BA/">数论</a></object><object><a href="/tags/%E8%B4%A8%E6%95%B0/">质数</a></object><object><a href="/tags/%E7%B4%A0%E6%95%B0%E5%88%A4%E5%AE%9A/">素数判定</a></object><object><a href="/tags/%E5%9F%83%E6%B0%8F%E7%AD%9B/">埃氏筛</a></object></span><time datetime="2026-03-20T02:30:00.000Z">2026-03-20</time></div><h1 class="recent-title">数论与算法应用之质数性质与基础质数筛</h1><div class="recent-excerpt"><hr><p>质数是数论中最基础、最重要的概念之一。<br>在算法题中，质数相关知识也经常出现，例如：</p>
<ul>
<li>判断一个数是不是质数</li>
<li>求某个范围内的所有质数</li>
<li>分解质因数</li>
<li>与最大公约数、最小公倍数结合考查</li>
</ul>
<p>因此，掌握质数的基本性质和基础筛法非常重要</p></div><span class="read-more">READ MORE +</span></object></a><a class="recent-post" href="/2026/03/20/C-%E5%9F%BA%E7%A1%80%E7%AE%97%E6%B3%95%E4%B9%8B%E6%B7%B1%E6%90%9C%E7%9A%84%E5%89%AA%E6%9E%9D%E6%8A%80%E5%B7%A7/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%AE%97%E6%B3%95%E5%AD%A6%E4%B9%A0/">算法学习</a></object></span><span class="tags"><object><a href="/tags/C/">C++</a></object><object><a href="/tags/%E7%AE%97%E6%B3%95/">算法</a></object><object><a href="/tags/%E6%B7%B1%E5%BA%A6%E4%BC%98%E5%85%88%E6%90%9C%E7%B4%A2/">深度优先搜索</a></object><object><a href="/tags/%E5%9B%9E%E6%BA%AF/">回溯</a></object><object><a href="/tags/%E5%89%AA%E6%9E%9D/">剪枝</a></object><object><a href="/tags/%E6%90%9C%E7%B4%A2%E4%BC%98%E5%8C%96/">搜索优化</a></object></span><time datetime="2026-03-20T02:15:00.000Z">2026-03-20</time></div><h1 class="recent-title">C++基础算法之深搜的剪枝技巧</h1><div class="recent-excerpt"><hr><p>在使用深度优先搜索时，如果把所有情况都无脑搜索一遍，往往会非常慢。<br>这时就需要一种优化方法：<strong>剪枝</strong></p>
<p>所谓剪枝，就是：</p>
<p><strong>在搜索过程中，提前判断某些分支不可能产生最优解或合法解，于是直接停止继续搜索</strong></p>
<p>这样就能大大减少搜索量，提高运行效率</p></div><span class="read-more">READ MORE +</span></object></a><a class="recent-post" href="/2026/03/20/C-%E5%9F%BA%E7%A1%80%E7%AE%97%E6%B3%95%E4%B9%8B%E6%B7%B1%E5%BA%A6%E4%BC%98%E5%85%88%E6%90%9C%E7%B4%A2/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%AE%97%E6%B3%95%E5%AD%A6%E4%B9%A0/">算法学习</a></object></span><span class="tags"><object><a href="/tags/C/">C++</a></object><object><a href="/tags/%E7%AE%97%E6%B3%95/">算法</a></object><object><a href="/tags/%E6%B7%B1%E5%BA%A6%E4%BC%98%E5%85%88%E6%90%9C%E7%B4%A2/">深度优先搜索</a></object><object><a href="/tags/%E9%80%92%E5%BD%92/">递归</a></object><object><a href="/tags/%E5%9B%9E%E6%BA%AF/">回溯</a></object><object><a href="/tags/%E5%85%A8%E6%8E%92%E5%88%97/">全排列</a></object></span><time datetime="2026-03-20T02:00:00.000Z">2026-03-20</time></div><h1 class="recent-title">C++基础算法之深度优先搜索</h1><div class="recent-excerpt"><hr><p>深度优先搜索，英文叫 <strong>Depth First Search</strong>，通常简称 <strong>DFS</strong>。<br>它是一种非常基础但非常重要的搜索算法，在图论、迷宫、排列组合、回溯等问题中都有广泛应用。</p>
<p>DFS 的核心思想可以概括为一句话：</p>
<p><strong>先沿着一条路一直走到底，走不通了再回头</strong></p></div><span class="read-more">READ MORE +</span></object></a><a class="recent-post" href="/2026/03/17/C-%E5%9F%BA%E7%A1%80%E7%AE%97%E6%B3%95%E4%B9%8B%E9%AB%98%E7%B2%BE%E5%BA%A6%E4%B9%98%E6%B3%95/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%AE%97%E6%B3%95%E5%AD%A6%E4%B9%A0/">算法学习</a></object></span><span class="tags"><object><a href="/tags/C/">C++</a></object><object><a href="/tags/%E7%AE%97%E6%B3%95/">算法</a></object><object><a href="/tags/%E9%AB%98%E7%B2%BE%E5%BA%A6%E8%AE%A1%E7%AE%97/">高精度计算</a></object><object><a href="/tags/%E5%A4%A7%E6%95%B4%E6%95%B0/">大整数</a></object><object><a href="/tags/%E6%A8%A1%E6%8B%9F/">模拟</a></object><object><a href="/tags/%E7%AB%96%E5%BC%8F%E4%B9%98%E6%B3%95/">竖式乘法</a></object></span><time datetime="2026-03-17T13:10:00.000Z">2026-03-17</time></div><h1 class="recent-title">C++基础算法之高精度乘法</h1><div class="recent-excerpt"><hr><p>高精度乘法用于处理超出普通整型范围的大整数相乘问题。它的核心思想是模拟竖式乘法，通过数组保存每一位数字，并统一处理进位。</p></div><span class="read-more">READ MORE +</span></object></a><a class="recent-post" href="/2026/03/17/C-%E5%9F%BA%E7%A1%80%E7%AE%97%E6%B3%95%E4%B9%8B%E9%AB%98%E7%B2%BE%E5%BA%A6%E9%99%A4%E6%B3%95/"><object><div class="recent-info"><span class="categories"><object><a href="/categories/%E7%AE%97%E6%B3%95%E5%AD%A6%E4%B9%A0/">算法学习</a></object></span><span class="tags"><object><a href="/tags/C/">C++</a></object><object><a href="/tags/%E7%AE%97%E6%B3%95/">算法</a></object><object><a href="/tags/%E9%AB%98%E7%B2%BE%E5%BA%A6%E8%AE%A1%E7%AE%97/">高精度计算</a></object><object><a href="/tags/%E5%A4%A7%E6%95%B4%E6%95%B0/">大整数</a></object><object><a href="/tags/%E6%A8%A1%E6%8B%9F/">模拟</a></object><object><a href="/tags/%E4%BD%99%E6%95%B0/">余数</a></object></span><time datetime="2026-03-17T10:20:00.000Z">2026-03-17</time></div><h1 class="recent-title">C++基础算法之高精度除法</h1><div class="recent-excerpt"><hr><p align="center">
